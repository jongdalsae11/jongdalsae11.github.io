<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>글쓰기 — 이름</title>
  <link rel="icon" href="./assets/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://hangeul.pstatic.net/hangeul_static/css/nanum-square-neo.css">
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
  <link rel="stylesheet" href="./assets/css/base.css">
  <link rel="stylesheet" href="./assets/css/layout.css">
  <link rel="stylesheet" href="./assets/css/components.css">
  <link rel="stylesheet" href="./assets/css/post.css">
  <style>
    /* ── 글쓰기 화면 전용 (2단: 작성 / 미리보기) ── */
    main { padding-left: 24px; padding-right: 24px; }
    .write-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 22px;
      max-width: 1400px;
      margin: 0 auto;
    }
    .w-panel {
      border: 1px solid var(--line-soft);
      border-radius: 10px;
      background: var(--surface);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      min-height: 76vh;
    }
    .w-panel-head {
      font-family: var(--mono);
      font-size: 0.68rem;
      color: var(--faint);
      letter-spacing: 0.1em;
      padding: 9px 16px;
      border-bottom: 1px solid var(--line-soft);
    }
    .w-fields {
      display: grid;
      grid-template-columns: 1fr 130px 130px 1fr;
      gap: 8px;
      padding: 12px 14px;
      border-bottom: 1px solid var(--line-soft);
    }
    .w-fields input, .w-fields select {
      font: inherit;
      font-size: 0.84rem;
      color: var(--text);
      background: var(--bg);
      border: 1px solid var(--line-soft);
      border-radius: 7px;
      padding: 6px 10px;
      outline: none;
    }
    .w-fields input:focus, .w-fields select:focus { border-color: var(--cyan); }
    .w-toolbar {
      display: flex;
      gap: 4px;
      flex-wrap: wrap;
      padding: 8px 12px;
      border-bottom: 1px solid var(--line-soft);
    }
    .w-toolbar button {
      font-family: var(--mono);
      font-size: 0.7rem;
      color: var(--soft);
      background: none;
      border: 1px solid var(--line-soft);
      border-radius: 6px;
      padding: 3px 9px;
      cursor: pointer;
      transition: color .15s, border-color .15s;
    }
    .w-toolbar button:hover { color: var(--cyan); border-color: rgba(56,189,248,.4); }
    #editor {
      flex: 1;
      width: 100%;
      resize: none;
      border: 0;
      outline: none;
      background: var(--bg);
      color: var(--text);
      font-family: var(--mono);
      font-size: 0.84rem;
      line-height: 1.75;
      padding: 18px;
    }
    #preview { flex: 1; overflow-y: auto; padding: 22px 26px; background: var(--bg); }
    #preview .sidenote { display: block; }  /* 미리보기에선 항상 본문 내 박스 */
    .w-actions {
      display: flex;
      gap: 8px;
      justify-content: flex-end;
      padding: 10px 14px;
      border-top: 1px solid var(--line-soft);
    }
    .w-actions button {
      font-family: var(--mono);
      font-size: 0.74rem;
      color: var(--text);
      background: var(--surface-2);
      border: 1px solid var(--line);
      border-radius: 7px;
      padding: 6px 14px;
      cursor: pointer;
      transition: border-color .15s, color .15s;
    }
    .w-actions button:hover { color: var(--cyan); border-color: var(--cyan); }
    .w-help {
      max-width: 1400px;
      margin: 14px auto 0;
      font-family: var(--mono);
      font-size: 0.7rem;
      color: var(--faint);
    }
    @media (max-width: 1100px) {
      .write-grid { grid-template-columns: 1fr; }
      .w-fields { grid-template-columns: 1fr 1fr; }
    }
  </style>
</head>
<body data-crumb="~ / <b>글쓰기</b>">
  <main>
    <div class="write-grid">
      <section class="w-panel">
        <div class="w-panel-head">WRITE — 마크다운 + ^[여백주석] + [[글 연결]]</div>
        <div class="w-fields">
          <input id="f-title" type="text" placeholder="제목">
          <select id="f-cat">
            <option value="math">수학</option>
            <option value="algo" selected>알고리즘</option>
            <option value="essay">에세이</option>
          </select>
          <input id="f-date" type="date">
          <input id="f-tags" type="text" placeholder="태그 (쉼표로 구분)">
        </div>
        <div class="w-toolbar">
          <button data-ins="h2">H2</button>
          <button data-ins="bold">**굵게**</button>
          <button data-ins="code">`code`</button>
          <button data-ins="fence">```코드블록```</button>
          <button data-ins="imath">$수식$</button>
          <button data-ins="math">$$디스플레이$$</button>
          <button data-ins="sn">^[여백주석]</button>
          <button data-ins="wiki">[[글 연결]]</button>
          <button data-ins="link">[링크]()</button>
        </div>
        <textarea id="editor" spellcheck="false" placeholder="본문을 작성하세요.

^[이렇게 쓰면 여백주석이 됩니다]
[[다른 글 제목]] 으로 글을 연결할 수 있습니다.
^[[[다른 글 제목]]에서 다룬 논증과 같은 구조 — 겹쳐 쓰기도 됩니다]"></textarea>
        <div class="w-actions">
          <button id="exp-md">.md 내보내기</button>
          <button id="exp-html">HTML 내보내기</button>
        </div>
      </section>

      <section class="w-panel">
        <div class="w-panel-head">PREVIEW — 실시간 미리보기</div>
        <div id="preview"></div>
      </section>
    </div>
    <p class="w-help">HTML 내보내기 → 받은 파일을 posts/ 폴더에 넣으면 바로 글 페이지가 됩니다. (.md는 원고 보관용)</p>
  </main>
  <footer><p>&copy; 2026</p></footer>

  <script>window.ROOT='.'</script>
  <script src="./assets/js/nav.js"></script>
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
  <script src="./assets/js/write.js"></script>
</body>
</html>
