<body data-crumb="~ / <b>글 지도</b>">
  <main id="main">
    <div class="page page--graph">
      <div class="page-head">
        <p class="eyebrow">MAP</p>
        <h1>글 지도</h1>
        <p class="lede">
          글이 어떤 글을 인용하는지 한 화면에 펼친 지도입니다.
          왼쪽일수록 먼저 읽어야 할 글이고, <b class="lede-flow">주황 선</b>은 제가 정한 읽는 순서입니다.
        </p>
      </div>

      <div class="g-bar">
        <span class="g-stats" id="g-stats"></span>
        <span class="g-hint">바탕을 끌면 이동 · 휠로 확대 · 노드를 끌면 옮김 · 누르면 그 글로</span>
        <button class="g-btn g-btn--sm" id="btn-fit">가운데 맞춤</button>
        <button class="g-btn g-btn--sm" id="btn-reset">배치 되돌리기</button>
        <button class="g-btn" id="btn-flow" aria-pressed="false">흐름 편집</button>
      </div>

      <div class="g-wrap">
        <div class="g-canvas" id="graph"></div>

        <aside class="flow-edit" id="flow-edit" hidden>
          <h2>흐름 만들기</h2>
          <p class="fl-guide">그래프에서 글을 <b>읽는 순서대로</b> 누르세요.
            다시 누르면 빠집니다.</p>

          <label class="fl-field"><span>고칠 흐름</span>
            <select id="flow-pick"></select></label>
          <label class="fl-field"><span>이름</span>
            <input type="text" id="flow-name" placeholder="예: 해석학 기초"></label>

          <ol class="fl-list" id="flow-list"></ol>

          <p class="flow-state" id="flow-state"></p>
          <div class="fl-actions">
            <button class="g-btn g-btn--ghost" id="btn-flow-del">흐름 지우기</button>
            <button class="g-btn g-btn--go" id="btn-flow-save">저장</button>
          </div>
          <p class="fl-note">저장하면 <code>content.js</code> 의 <code>flows</code> 에 바로 써집니다.
            (크롬·엣지에서 폴더 연결 필요)</p>
        </aside>
      </div>
    </div>
  </main>
  <footer><p>&copy; 2026</p></footer>

</body>
</html>
