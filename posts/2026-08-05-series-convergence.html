          <h1>급수의 수렴 판정을 다시 보기</h1>
          <div class="post-meta">
            <span class="post-date">2026.08.05</span>
            <span class="tag">해석학</span>
          </div>
        </div>
        <div class="post-body">
<p>비판정법이 실패하는 지점에서 근판정법이 답을 주는 경우가 있다. 두 판정법의
    강도를 비교해 두면 어떤 순서로 시도할지 정할 수 있다.<span class="sidenote">$\limsup$을
    쓰는 근판정법이 비판정법보다 엄밀히 강하다.</span></p>
    <h2>정리</h2>
    <p>$$\limsup_{n\to\infty} \sqrt[n]{|a_n|} < 1 \implies \sum a_n \text{ 절대수렴}$$</p>
    <p>합 계산 자체는 <span class="cite" data-ref="Ref-M01"></span>의 표기를 참고했다.</p>
