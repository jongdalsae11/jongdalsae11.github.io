# ============================================================
#  push 할 때마다 자동으로 실행됩니다.
#   1. content.js 를 점검하고 (오류가 있으면 실패로 표시)
#   2. sitemap.xml · feed.xml · 글 메타태그 · 캐시 번호를 새로 만들어
#   3. 그 결과를 그대로 GitHub Pages 에 올립니다.
#
#  예전에는 3번 대신 결과를 저장소에 되커밋했습니다. 그러면 push 할 때마다
#  원격에 [auto] 커밋이 하나 더 생겨 내 로컬이 항상 한 칸 뒤처지고,
#  다음 push 가 거부되었습니다. 이제 커밋을 만들지 않으므로
#  git pull 없이 git push 만 하면 됩니다.
#
#  ※ 저장소 Settings → Pages → Source 를 "GitHub Actions" 로 바꿔야
#     이 워크플로의 결과가 실제로 배포됩니다.
# ============================================================
name: build site

on:
  push:
    branches: [main]
  workflow_dispatch:      # 저장소 Actions 탭에서 수동 실행도 가능

permissions:
  contents: read
  pages: write
  id-token: write

# 배포는 한 번에 하나씩. 연달아 push 해도 마지막 것이 올라갑니다.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 사이트 점검 및 생성
        run: node tools/build.mjs

      - name: 무엇이 갱신됐는지 기록만 남김
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "빌드가 아래 파일을 갱신했습니다 (저장소에는 커밋하지 않습니다):"
            git status --porcelain
          else
            echo "이미 최신 상태입니다."
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
