<body class="sim-page" data-crumb="시뮬레이션 / <b>런 렝스 부호화</b>">

        <p class="lede">인코딩 코드의 <span class="mono">cnt</span> 가 어떻게 늘어나고
          언제 <span class="mono">개수+문자</span> 가 튀어나오는지, 그리고 디코딩이
          여러 자리 숫자를 어떻게 다시 읽어 내는지를 그대로 따라갑니다.</p>

  <script>window.ROOT='..'</script>
  <script src="../assets/data/content.js?v=68f0bd90"></script>
  <script src="../assets/js/util.js?v=6ae4aef1"></script>
  <script src="../assets/js/nav.js?v=04ca6e81"></script>
  <script src="../assets/js/sim.js?v=00b7da8f"></script>
  <script>
  /* ============================================================
     글의 두 코드(인코딩·디코딩)를 그대로 한 칸씩 밟습니다.
     변수 이름도 글의 코드와 같게 두었습니다 — cnt · str[i] · s.
     ============================================================ */
  Sim.run('#sim', {
    note: '‹한 칸 ⏭› 을 누르면 코드가 한 걸음씩 움직입니다. 파란 줄은 «조건이 맞아 ' +
          '계속 세는» 걸음, 주황 줄은 «내놓는» 걸음입니다. 인코딩이 끝나면 같은 ' +
          '자리에서 디코딩이 이어집니다.',
    controls: [
      { id: 'text', type: 'text', label: '입력',
        value: 'WWWWWWWWWWWWBBBWWWWWWB', placeholder: 'W 와 B 로 아무렇게나' }
    ],

    setup: function (c) {
      var src = String(c.opts.text || '').replace(/\s+/g, '') || 'WWWWWWWWWWWWBBBWWWWWWB';
      c.state = {
        src: src,
        phase: 'enc',
        /* 인코딩 — i 는 지금 세고 있는 구간의 시작, j 는 비교 중인 자리 */
        i: 0, j: 0, cnt: 1, toks: [], fresh: -1,
        /* 디코딩 — k 는 인코딩 결과에서 읽는 자리 */
        enc: '', k: 0, dcnt: 0, building: false, out: '', dfresh: false,
        say: '시작합니다. <code>cnt = 1</code> 로 두고 첫 글자부터 봅니다.',
        tone: ''
      };
    },

    step: function (c) {
      var st = c.state, s = st.src, n = s.length;

      /* ── 인코딩 ────────────────────────────────────
         while (str[i] == str[i+1] && i+1 < n) { cnt++; i++; }
         fprintf(out, "%d%c", cnt, str[i]);                     */
      if (st.phase === 'enc') {
        st.fresh = -1;
        if (st.j + 1 < n && s[st.j + 1] === s[st.j]) {
          st.cnt++; st.j++;
          st.say = '<code>str[i+1]</code> 도 <b>' + s[st.j] + '</b> 다 — 연속이 이어지므로 ' +
                   '<code>cnt</code> 를 <b>' + st.cnt + '</b>' + Sim.josa(st.cnt, '로') +
                   ' 늘리고 한 칸 옮깁니다.';
          st.tone = 'go';
          return true;
        }
        /* 연속이 끊겼다 → 구간 하나를 내놓는다 */
        st.toks.push({ cnt: st.cnt, ch: s[st.j] });
        st.fresh = st.toks.length - 1;
        st.say = (st.j + 1 < n
                    ? '다음 글자가 <b>' + s[st.j + 1] + '</b> 라 연속이 끊겼습니다. '
                    : '문자열이 끝났습니다. ') +
                 '지금까지 센 구간을 <code>' + st.cnt + s[st.j] + '</code> 로 내놓습니다.';
        st.tone = 'emit';
        st.i = st.j + 1; st.j = st.i; st.cnt = 1;

        if (st.i >= n) {
          st.enc = st.toks.map(function (t) { return t.cnt + t.ch; }).join('');
          st.phase = 'dec';
          st.say += ' 인코딩 끝 — <code>' + st.enc + '</code> 입니다. 이제 되돌립니다.';
        }
        return true;
      }

      /* ── 디코딩 ────────────────────────────────────
         cnt = str[i] - '0';
         while (isdigit(str[i+1])) { cnt = cnt*10 + (str[i+1]-'0'); i++; }
         for (j = 1; j <= cnt; j++) putchar(str[i+1]);          */
      if (st.phase === 'dec') {
        var e = st.enc;
        st.dfresh = false;
        if (st.k >= e.length) { st.phase = 'end'; return 'end'; }

        var ch = e[st.k];
        if (ch >= '0' && ch <= '9') {
          var d = ch.charCodeAt(0) - 48;
          if (!st.building) {
            st.dcnt = d; st.building = true;
            st.say = '숫자 <b>' + d + '</b>' + Sim.josa(d, '을') +
                     ' 만났습니다 — <code>cnt = ' + d + '</code>.';
          } else {
            var before = st.dcnt;
            st.dcnt = st.dcnt * 10 + d;
            st.say = '숫자가 이어집니다 — <code>cnt = ' + before + ' × 10 + ' + d +
                     ' = ' + st.dcnt + '</code>. 여러 자리 개수는 이렇게 왼쪽으로 밀며 읽습니다.';
          }
          st.tone = 'go';
          st.k++;
          return true;
        }

        /* 숫자가 끝났다 → 그 개수만큼 문자를 찍는다 */
        var rep = new Array(st.dcnt + 1).join(ch);
        st.out += rep;
        st.say = '숫자가 끝나고 <b>' + ch + '</b> 가 왔습니다 — <b>' + st.dcnt +
                 '</b> 번 찍습니다: <code>' + rep + '</code>';
        st.tone = 'emit';
        st.dfresh = true;
        st.building = false; st.dcnt = 0;
        st.k++;
        if (st.k >= e.length) {
          st.phase = 'end';
          st.say += ' 복원 끝.';
          return 'end';
        }
        return true;
      }
      return 'end';
    },

    draw: function (c) {
      var st = c.state, s = st.src, n = s.length;
      var encoding = st.phase === 'enc';

      /* ── 단계 표시 ── */
      var phase =
        '<div class="sm-phase">' +
        '<span class="' + (encoding ? 'on' : 'past') + '">인코딩</span>→' +
        '<span class="' + (encoding ? '' : 'on') + '">디코딩</span></div>';

      /* ── 원본 띠 — 세고 있는 구간은 파랗게, 커서는 진하게 ── */
      var chars = '';
      for (var x = 0; x < n; x++) {
        var cls = 'ch';
        if (encoding) {
          if (x < st.i) cls += ' done';
          else if (x >= st.i && x < st.j) cls += ' run';
          else if (x === st.j) cls += ' cur';
        } else cls += ' done';
        chars += '<span class="' + cls + '">' + s[x] + '</span>';
      }

      /* ── 내놓은 토큰들 ── */
      var toks = st.toks.map(function (t, k) {
        return '<span class="sm-tok' + (k === st.fresh ? ' fresh' : '') + '">' +
               '<b>' + t.cnt + '</b>' + t.ch + '</span>';
      }).join('') || '<span class="sm-val--dim">아직 없음</span>';

      var html =
        phase +
        '<div class="sm-row"><span class="sm-tag">원본</span>' +
          '<span class="sm-chars">' + chars + '</span></div>';

      if (encoding) {
        html +=
          '<div class="sm-row"><span class="sm-tag">cnt</span>' +
            '<span class="sm-val sm-val--hi">' + st.cnt + '</span></div>' +
          '<div class="sm-row"><span class="sm-tag">str[i]</span>' +
            '<span class="sm-val sm-val--hi">' + (s[st.j] || '·') + '</span></div>';
      } else {
        /* 디코딩 — 인코딩 결과를 읽어 가는 커서 */
        var ec = '';
        for (var y = 0; y < st.enc.length; y++) {
          var c2 = 'ch';
          if (y < st.k - 1) c2 += ' done';
          else if (y === st.k - 1 && st.dfresh) c2 += ' out';
          else if (y === st.k) c2 += ' cur';
          else if (y < st.k) c2 += ' done';
          ec += '<span class="' + c2 + '">' + st.enc[y] + '</span>';
        }
        html +=
          '<div class="sm-row"><span class="sm-tag">인코딩</span>' +
            '<span class="sm-chars">' + ec + '</span></div>' +
          '<div class="sm-row"><span class="sm-tag">cnt</span>' +
            '<span class="sm-val sm-val--hi">' + (st.building ? st.dcnt : '·') + '</span></div>';
      }

      html +=
        '<div class="sm-row"><span class="sm-tag">' +
          (encoding ? '결과' : '인코딩 결과') + '</span>' +
          '<span class="sm-toks">' + toks + '</span></div>';

      if (!encoding) {
        var ok = st.out === s.slice(0, st.out.length);
        html +=
          '<div class="sm-row"><span class="sm-tag">복원</span>' +
            '<span class="sm-val">' + (st.out || '·') +
            (st.out ? ' <span class="' + (ok ? 'sm-ok' : 'sm-no') + '">' +
              (st.phase === 'end'
                ? (st.out === s ? '원본과 완전히 일치' : '어긋남')
                : (ok ? '여기까지 일치' : '어긋남')) + '</span>' : '') +
            '</span></div>';
      }

      html += '<p class="sm-say' + (st.tone ? ' sm-say--' + st.tone : '') + '">' +
              st.say + '</p>';

      c.stage.innerHTML = html;

      c.stat('원본', n + '자');
      c.stat('구간', st.toks.length + '개');
      if (st.enc) c.stat('인코딩', st.enc.length + '자');
      if (st.phase === 'end') {
        c.stat('복원', st.out === s ? '원본과 일치' : '어긋남',
               st.out === s ? 'ok' : 'bad');
      }
    }
  });
  </script>
</body>
