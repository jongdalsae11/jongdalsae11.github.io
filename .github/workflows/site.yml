# ============================================================
#  push 할 때마다 자동으로 실행됩니다.
#   1. content.js 를 점검하고 (오류가 있으면 실패로 표시)
#   2. sitemap.xml · feed.xml · 글 메타태그를 새로 만들어
#   3. 바뀐 게 있으면 자동으로 커밋합니다.
#  → 글을 추가할 때 sitemap 을 직접 고칠 필요가 없습니다.
# ============================================================
name: build site

on:
  push:
    branches: [main]
  workflow_dispatch:      # 저장소 Actions 탭에서 수동 실행도 가능

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    # 이 워크플로가 만든 커밋으로 다시 실행되는 것을 방지
    if: "!contains(github.event.head_commit.message, '[auto]')"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 사이트 점검 및 생성
        run: node tools/build.mjs

      - name: 바뀐 내용 커밋
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain)" ]; then
            git add -A
            git commit -m "[auto] sitemap · feed · 메타태그 갱신"
            git push
          else
            echo "변경 사항 없음"
          fi
